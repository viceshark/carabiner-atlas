      ${sling ? '' : fRange('cImpact',T('cImpact'),T('hImpact'),7,11.5,0.1,c.impact)}
      ${fRange('cLen',sling?T('cLenSling'):T('cLenDyn'),sling?T('hLenSling'):T('hLenDyn'),sling?0.3:2,sling?2.4:60,sling?0.1:1,c.len)}
      ${fRange('cFall',T('cFall'),T('hFall'),0,(2*c.len).toFixed(1),0.1,c.fall)}
      ${fSet(T('cPos'),T('hPos'),fOpt('radio','cPos','top',T('cPosTop'),T('cPosTopHint'),c.pos==='top')+fOpt('radio','cPos','harness',T('cPosHarness'),T('cPosHarnessHint'),c.pos==='harness'))}
    </form>
    <div class="calc-out" id="calcOut" aria-live="polite"></div>
  </section>
  <section class="sec specgrid">
    <div class="prose"><div><h3>${T('cHowTitle')}</h3><ul class="plist dot">${T('cHow').map(x=>`<li>${x}</li>`).join('')}</ul></div></div>
    <aside class="box"><h3>${T('cAssumeTitle')}</h3><ul class="plist dot">${T('cAssume').map(x=>`<li>${x}</li>`).join('')}</ul></aside>
  </section>`;
}
function renderCalcOut(){
  const out = document.getElementById('calcOut'); if(!out) return;
  const c = state.calc, m = MBY[c.model], W = c.mass*G, k = ropeK(c), L = c.len, h = Math.min(c.fall, 2*L), f = L>0 ? h/L : 0, pos = POS_FACTOR[c.pos];
  const F = peakForce(W,k,f), Fc = F*pos;
  const put = (id,txt) => {const el = document.getElementById(id);if(el) el.textContent = txt;};
  put('cMassOut',`${c.mass} ${T('kg')}`); put('cImpactOut',`${fmtN(c.impact,1)} ${T('kN')}`); put('cLenOut',`${fmtN(L,1)} ${T('m')}`); put('cFallOut',`${fmtN(h,1)} ${T('m')}`);
  const dirs = [['major',T('dirMajor')],['minor',T('dirMinor')],['open',T('dirOpen')]].map(([key,label])=>{
    const S = m[key]*1000, ratio = Fc/S, Fb = S/pos;
    const st = ratio>=1 ? 'break' : ratio>=0.8 ? 'edge' : 'ok';
    const stText = st==='break' ? T('stBreak') : st==='edge' ? T('stEdge') : T('stOk')(fmtN(S/Fc,1));
    // Fall factor at which the peak force on the carabiner reaches its strength, for the current weight.
    const fb = Fb<=2*W ? 0 : Fb*(Fb-2*W)/(2*W*k);
    const hText = fb===0 ? T('thHZero') : fb>2 ? T('thHNo')(fmtN(fb,1)) : T('thHVal')(fmtN(fb*L,1));
    // Body weight at which the current fall breaks it: from F = W + sqrt(W² + 2Wkf) solved for W.
    const mb = Fb*Fb/(2*G*(Fb+k*f));
    const mText = mb>300 ? T('thMNo') : T('thMVal')(Math.ceil(mb));
    return `<div class="dir st-${st}">
      <div class="dhead">${picto(key,24)}<b>${label}</b><span class="mono">${T('ofStrength')(fmtN(Fc/1000,1),m[key])}</span><span class="stchip">${stText}</span></div>
      <div class="dbar"><i style="width:${Math.min(100,ratio*100).toFixed(1)}%"></i></div>
      <dl class="thr"><div><dt>${T('thH')}</dt><dd>${hText}</dd></div><div><dt>${T('thM')}</dt><dd>${mText}</dd></div></dl>
    </div>`;
  }).join('');
  out.innerHTML = `<div class="cbig"><p class="eyebrow">${T('cOnBiner')}</p><p class="cforce"><b>${fmtN(Fc/1000,1)}</b> ${T('kN')}</p>
    <p class="muted">${T('cFactor')} ${fmtN(f,2)} · ${fmtN(F/1000,1)} ${T('kN')} ${T('cOnClimber')} · <a href="#m-${m.id}">${esc(m.brand+' '+m.name)}</a></p></div>${dirs}`;
}
function onCalcInput(t){
  const c = state.calc;
  if(t.name==='cLink'){
    c.link = t.value;
    Object.assign(c, c.link==='sling' ? {len:0.6, fall:0.6, pos:'harness'} : {len:10, fall:4, pos:'top'});
    render('calc'); return;
  }
  if(t.name==='cPos') c.pos = t.value;
  if(t.id==='cModel') c.model = t.value;
  if(t.id==='cMass') c.mass = +t.value;
  if(t.id==='cImpact') c.impact = +t.value;
  if(t.id==='cFall') c.fall = +t.value;
  if(t.id==='cLen'){
    c.len = +t.value;
    const fall = document.getElementById('cFall');
    fall.max = (2*c.len).toFixed(1);
    c.fall = Math.min(c.fall, +(2*c.len).toFixed(1));
    fall.value = c.fall;
  }
  renderCalcOut();
}

/* ---------- wear calculator ---------- */
// Wear multipliers are the atlas's own assumptions; the retire verdict comes only from inspection.
const ENV_WEAR = {gym:1, rock:1.5, sand:4, sea:1.5};
function viewWear(){
  const w = state.wear;
  const models = [...MODELS].sort((a,b)=>(a.brand+a.name).localeCompare(b.brand+b.name)).map(m=>[m.id,m.brand+' '+m.name]);
  return `
  ${calcHead('wear')}
  <section class="sec calc">
    <form class="box cform" id="wearForm" onsubmit="return false">
      ${fSelect('wModel',T('wModel'),T('hwModel'),models,w.model)}
      ${fSet(T('wRole'),T('hwRole'),fOpt('radio','wRole','rope',T('wRoleRope'),T('wRoleRopeSub'),w.role==='rope')+fOpt('radio','wRole','fixed',T('wRoleFixed'),T('wRoleFixedSub'),w.role==='fixed'))}
      ${fRange('wMonths',T('wMonths'),T('hwMonths'),1,180,1,w.months)}
      ${fRange('wDays',T('wDays'),T('hwDays'),0,30,1,w.days)}
      ${fRange('wLowers',T('wLowers'),T('hwLowers'),0,20,1,w.lowers)}
      ${fRange('wFalls',T('wFalls'),T('hwFalls'),0,500,1,w.falls)}
      ${fRange('wHard',T('wHard'),T('hwHard'),0,20,1,w.hard)}
      ${fSelect('wEnv',T('wEnv'),T('hwEnv'),Object.entries(T('envNames')),w.env)}
      ${fSet(T('wEvents'),T('hwEvents'),fOpt('checkbox','wDrop','1',T('wDrop'),T('wDropSub'),w.drop)+fOpt('checkbox','wSteel','1',T('wSteel'),T('wSteelSub'),w.steel))}
      ${fSet(T('wInspect'),T('hwInspect'),
        fSelect('wGroove',T('wGroove'),T('hwGroove'),Object.entries(T('grooveNames')),w.groove)+
        fSelect('wGate',T('wGate'),T('hwGate'),Object.entries(T('gateNames')),w.gate)+
        fSelect('wBody',T('wBody'),T('hwBody'),Object.entries(T('bodyNames')),w.body))}
      ${fSet(T('wSling'),T('hwSling'),fOpt('checkbox','wSlingOn','1',T('wSlingOn'),T('wSlingOnSub'),w.sling))}
      ${w.sling ? fRange('wSlingYears',T('wSlingYears'),T('hwSlingYears'),0,15,1,w.slingYears) : ''}
    </form>
    <div class="calc-out" id="wearOut" aria-live="polite"></div>
  </section>
  <section class="sec specgrid">
    <div class="prose"><div><h3>${T('wHowTitle')}</h3><ul class="plist dot">${T('wHow').map(x=>`<li>${x}</li>`).join('')}</ul></div></div>
    <aside class="box"><h3>${T('cAssumeTitle')}</h3><ul class="plist dot">${T('wAssume').map(x=>`<li>${x}</li>`).join('')}</ul></aside>
  </section>`;
}
function renderWearOut(){
  const out = document.getElementById('wearOut'); if(!out) return;
  const w = state.wear, m = MBY[w.model], steel = m.material==='steel';
  const put = (id,txt) => {const el = document.getElementById(id);if(el) el.textContent = txt;};
  put('wMonthsOut',T('monthsFmt')(w.months)); put('wDaysOut',T('perMonth')(w.days)); put('wLowersOut',T('perDay')(w.lowers));
  put('wFallsOut',String(w.falls)); put('wHardOut',String(w.hard)); put('wSlingYearsOut',T('yearsFmt')(w.slingYears));
  const k = ENV_WEAR[w.env]*(w.role==='rope'?1:0.1)*(steel?0.15:1);
  const monthly = w.days*w.lowers*k;
  const total = Math.round(monthly*w.months + w.falls*0.5*k);
  const band = total<300 ? 'ok' : total<1500 ? 'edge' : 'break';
  const items = [];
  const add = (sev,[title,text]) => items.push([sev,title,text]);
  if(w.groove==='deep') add('break',T('rGrooveDeep'));
  if(w.gate==='broken') add('break',T('rGateBroken')(m.open));
  if(w.body==='crack') add('break',T('rCrack'));
  if(w.gate==='sticky') add('edge',T('rGateSticky'));
  if(w.drop) add('edge',T('rDrop'));
  if(w.steel && !steel) add('edge',T('rSteel'));
  if(w.hard>0) add('edge',T('rHard')(w.hard));
  if(band==='break') add('edge',T('rHigh'));
  if(w.sling && w.slingYears>=10) add('edge',T('rSlingOld')(w.slingYears));
  if(w.groove==='shiny') add('ok',T('rGrooveShiny'));
  if(w.body==='scratch') add('ok',T('rScratch'));
  if(w.env==='sea') add('ok',T('rSea'));
  if(w.sling && w.slingYears>=8 && w.slingYears<10) add('ok',T('rSlingSoon')(w.slingYears));
  if(!items.length) add('ok',T('rNone'));
  const verdict = items.some(i=>i[0]==='break') ? 'break' : items.some(i=>i[0]==='edge') ? 'edge' : 'ok';
  const iv = monthly>=100 ? T('ivEach') : monthly>=20 ? T('ivMonth') : T('ivSeason');
  out.innerHTML = `<div class="cbig"><p class="eyebrow">${T('wVerdictLabel')}</p>
      <p class="verdict st-${verdict}"><span class="stchip">${T({ok:'vOk',edge:'vEdge',break:'vBreak'}[verdict])}</span></p>
      <p class="muted"><a href="#m-${m.id}">${esc(m.brand+' '+m.name)}</a> · ${T('mat')[m.material]}</p></div>
    <div class="dir st-${band}">
      <div class="dhead">${picto('material',24)}<b>${T('wExposure')}</b><span class="mono">${T('wExposureVal')(total)}</span><span class="stchip">${T('bandNames')[band]}</span></div>
      <div class="dbar"><i style="width:${Math.min(100,total/2000*100).toFixed(1)}%"></i></div>
      <p class="mcap">${T('wCheckEvery')(iv)}</p>
    </div>
    <ul class="reasons">${items.map(([sev,title,text])=>`<li class="st-${sev}"><span class="stchip">${T('sevNames')[sev]}</span><div><b>${title}</b><p>${text}</p></div></li>`).join('')}</ul>
    <p class="mcap">${T('wLife')}</p>`;
}
function onWearInput(t){
  const w = state.wear;
  const num = {wMonths:'months',wDays:'days',wLowers:'lowers',wFalls:'falls',wHard:'hard',wSlingYears:'slingYears'};
  const txt = {wModel:'model',wEnv:'env',wGroove:'groove',wGate:'gate',wBody:'body'};
  if(num[t.id]) w[num[t.id]] = +t.value;
  if(txt[t.id]) w[txt[t.id]] = t.value;
  if(t.name==='wRole') w.role = t.value;
  if(t.name==='wDrop') w.drop = t.checked;
  if(t.name==='wSteel') w.steel = t.checked;
  if(t.name==='wSlingOn'){w.sling = t.checked;render('wear');return;}
  renderWearOut();
}

/* ---------- router ---------- */
function render(tok){
  if(heroTimer){clearInterval(heroTimer);heroTimer=null;}
  state.route = tok || '';
  const app = document.getElementById('app');
  let html, after = null, navKey = 'types';
  if(tok && tok.startsWith('type-') && TBY[tok.slice(5)]) html = viewType(TBY[tok.slice(5)]);
  else if(tok && tok.startsWith('m-') && MBY[tok.slice(2)]) html = viewModel(MBY[tok.slice(2)]);
  else if(tok && tok.startsWith('spec-') && SBY[tok.slice(5)]){html = viewSpec(SBY[tok.slice(5)]);navKey='specs';}
  else if(tok==='specs'){html = viewSpecs();navKey='specs';}
  else if(tok==='calc'){html = viewCalc();navKey='calc';after = renderCalcOut;}
  else if(tok==='wear'){html = viewWear();navKey='calc';after = renderWearOut;}
  else {html = viewHome(); after = () => {renderGroups(); startHeroCycle();}; state.route='';}
  app.innerHTML = html;
  if(after) after();
  document.querySelectorAll('#nav a').forEach(a=>{if(a.dataset.k===navKey) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');});
}
function go(tok, keepScroll){
  try{history.pushState(null,'',tok ? '#'+tok : location.pathname+location.search);}catch(e){}
  render(tok);
  if(!keepScroll){window.scrollTo(0,0);try{document.getElementById('app').focus({preventScroll:true});}catch(e){}}
}
function renderChrome(){
  document.documentElement.lang = state.lang;
  document.getElementById('logo').innerHTML = `${logoSVG()}<span>${T('brand')}</span>`;
  document.getElementById('logo').setAttribute('aria-label',T('brand'));
  document.getElementById('nav').innerHTML = `<a href="#" data-k="types">${T('navTypes')}</a><a href="#specs" data-k="specs"><span class="nl">${T('navSpecs')}</span><span class="ns">${T('navSpecsShort')}</span></a><a href="#calc" data-k="calc"><span class="nl">${T('navCalc')}</span><span class="ns">${T('navCalcShort')}</span></a>`;
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===state.lang)));
  document.getElementById('footer').innerHTML = `<p><b>${T('brand')}</b><br>${T('footer')}</p><p>${T('footerSide')}</p>`;
}
function setLang(l){
  state.lang = l;
  try{localStorage.setItem('carabiner-atlas-lang',l);}catch(e){}
  renderChrome(); render(state.route);
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const lang = e.target.closest('[data-lang]');
  if(lang){setLang(lang.dataset.lang);return;}
  const chip = e.target.closest('[data-sphere]');
  if(chip){state.sphere = chip.dataset.sphere;document.querySelectorAll('[data-sphere]').forEach(b=>b.setAttribute('aria-pressed',String(b===chip)));renderGroups();return;}
  const br = e.target.closest('[data-brand]');
  if(br){state.brand = br.dataset.brand;document.querySelectorAll('[data-brand]').forEach(b=>b.setAttribute('aria-pressed',String(b===br)));renderGroups();return;}
  if(e.target.closest('[data-reset]')){state.sphere='all';state.brand='all';state.q='';render('');return;}
  const sg = e.target.closest('[data-sphere-go]');
  if(sg){e.preventDefault();state.sphere = sg.dataset.sphereGo;state.q='';go('');const f=document.querySelector('.filters');if(f) f.scrollIntoView({block:'start'});return;}
  const a = e.target.closest('a[href^="#"]');
  if(a){e.preventDefault();go(a.getAttribute('href').slice(1));}
});
document.addEventListener('input', e=>{
  if(e.target.id==='q'){state.q = e.target.value;renderGroups();return;}
  if(e.target.closest && e.target.closest('#calcForm')) onCalcInput(e.target);
  if(e.target.closest && e.target.closest('#wearForm')) onWearInput(e.target);
});
window.addEventListener('popstate',()=>render(location.hash.slice(1)));
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==state.route) render(h);});

const tip = document.getElementById('tip');
document.addEventListener('mouseover', e=>{
  const r = e.target.closest('[data-tip]');
  if(!r){tip.hidden = true;return;}
  const [h,b] = r.dataset.tip.split('|');
  tip.innerHTML = `<b>${esc(h)}</b>${esc(b||'')}`;
  tip.hidden = false;
});
document.addEventListener('mousemove', e=>{
  if(tip.hidden) return;
  const x = Math.min(e.clientX+14, window.innerWidth-tip.offsetWidth-8), y = e.clientY+16;
  tip.style.left = x+'px'; tip.style.top = (y+tip.offsetHeight>window.innerHeight ? e.clientY-tip.offsetHeight-10 : y)+'px';
});

setFavicon();
renderChrome();
render(location.hash.slice(1));
</script>
