<title>Атлас карабинов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: a gear wall. Carabiners hang as tiles on a granite ground, each drawn in its own anodised colour; every number is set like the stamp on a carabiner spine. */
:root{
  --bg:#E8EBEA;
  --surface:#F5F6F5;
  --surface-2:#DDE2E1;
  --ink:#13191C;
  --ink-2:#465157;
  --muted:#66727A;
  --line:#C8CFD0;
  --accent:#B83C0C;
  --accent-soft:#F4DCCF;
  --on-accent:#FFFFFF;
  --warn:#A8261A;
  --warn-soft:#F6DCD7;
  --emboss:rgba(255,255,255,.6);
  --good:#2E7A4B;
  --good-soft:#D9EEDF;
  --caution:#9A5B00;
  --caution-soft:#F6E5C6;
  --shadow:0 1px 0 rgba(19,25,28,.04),0 10px 24px -18px rgba(19,25,28,.35);
  --font-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --font-body:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101416;--surface:#171C1F;--surface-2:#20272B;--ink:#ECF0F0;--ink-2:#B3BDC1;--muted:#8A969C;--line:#2C3539;
    --accent:#FF7A3D;--accent-soft:#3A2116;--on-accent:#140A05;--warn:#FF8A7A;--warn-soft:#3A1915;--emboss:rgba(0,0,0,.55);--good:#6CCB8E;--good-soft:#173322;--caution:#F2B64A;--caution-soft:#3A2A10;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 28px -18px rgba(0,0,0,.85);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101416;--surface:#171C1F;--surface-2:#20272B;--ink:#ECF0F0;--ink-2:#B3BDC1;--muted:#8A969C;--line:#2C3539;
  --accent:#FF7A3D;--accent-soft:#3A2116;--on-accent:#140A05;--warn:#FF8A7A;--warn-soft:#3A1915;--emboss:rgba(0,0,0,.55);--good:#6CCB8E;--good-soft:#173322;--caution:#F2B64A;--caution-soft:#3A2A10;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 28px -18px rgba(0,0,0,.85);color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.wrap{max-width:1220px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(4px)){.site-header{background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}}
.hbar{display:flex;align-items:center;gap:16px;min-height:60px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.logo svg{color:var(--accent);flex:none}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{padding:6px 10px;border-radius:4px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:14px;white-space:nowrap}
.nav a:hover,.nav a[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
.lang button{font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.06em;padding:6px 9px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:600px){.logo span{display:none}.nav a{padding:6px 7px;font-size:13px}.hbar{gap:10px}}

#app{outline:none;padding-bottom:72px}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.8rem,1.05rem + 3vw,3.2rem);line-height:1.08;letter-spacing:-.025em;margin:.35em 0 .45em;text-wrap:balance;hyphens:auto;overflow-wrap:break-word}
h2{font-family:var(--font-display);font-weight:600;font-size:clamp(1.25rem,1rem + .9vw,1.6rem);line-height:1.15;letter-spacing:-.015em;margin:0;text-wrap:balance}
h3{font-size:1.0625rem;line-height:1.3;margin:0}
p{margin:0}
.lead{font-size:1.0625rem;color:var(--ink-2);max-width:62ch}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.pict{flex:none;vertical-align:-.25em}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:center;padding-block:52px 40px}
.hero-art{position:relative;display:grid;place-items:center;padding:24px 16px;border:1px solid var(--line);border-radius:8px;background-color:var(--surface);background-image:radial-gradient(var(--line) 1.3px,transparent 1.5px);background-size:20px 20px;background-position:10px 10px}
.hero-art svg{width:100%;max-width:300px;height:auto}
.hero-art .ax{opacity:.22;transition:opacity .3s}
.hero-art .ax path{fill:none;stroke:var(--ink-2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hero-art .ax-open path{stroke-dasharray:4 4}
.hero-art[data-hl="major"] .ax-major,.hero-art[data-hl="minor"] .ax-minor,.hero-art[data-hl="open"] .ax-open,.hero-art[data-hl="open"] .ax-major{opacity:1}
.hero-art[data-hl="major"] .ax-major path,.hero-art[data-hl="minor"] .ax-minor path,.hero-art[data-hl="open"] .ax-open path,.hero-art[data-hl="open"] .ax-major path{stroke:var(--accent)}
.hero-art .gate{transform-box:fill-box;transform-origin:100% 100%;transition:transform .55s cubic-bezier(.3,1.35,.5,1)}
.hero-art[data-hl="open"] .gate{transform:rotate(-24deg)}
.art-cap{position:absolute;left:14px;bottom:10px;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.art-cap a{color:var(--ink-2)}
.read{margin-top:28px;border-top:1px solid var(--line);padding-top:16px}
.legend3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.legend3 a{display:grid;gap:4px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-decoration:none;transition:border-color .2s,background .2s}
.legend3 a .pict{color:var(--ink-2)}
.legend3 a b{font-weight:600;font-size:.9375rem;line-height:1.25}
.legend3 a .mono{font-size:.8125rem;color:var(--muted)}
.legend3 a.on,.legend3 a:hover,.legend3 a:focus-visible{border-color:var(--accent);background:var(--accent-soft)}
.legend3 a.on .pict,.legend3 a:hover .pict{color:var(--accent)}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:28px;padding-top:32px}.hero-art{order:-1}.hero-art svg{max-width:200px}}
@media (max-width:520px){.legend3{grid-template-columns:1fr}.legend3 a{grid-template-columns:auto 1fr auto;align-items:center;gap:10px}}

/* filters */
.filters{scroll-margin-top:72px;display:grid;gap:12px;padding-block:16px;border-block:1px solid var(--line)}
.frow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.flabel{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:150px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 14px/1 var(--font-body);padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);cursor:pointer;transition:border-color .15s}
.chip:hover{border-color:var(--ink-2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.search{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0;max-width:420px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:15px var(--font-body);padding:9px 0;outline:none}
@media (max-width:700px){.search{max-width:none}}

/* groups and tiles */
.group{padding-top:40px}
.ghead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px;margin-bottom:18px}
.ghead p{color:var(--ink-2);max-width:64ch;flex:1 1 380px}
.ghead .count{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.ghead > div{display:grid;gap:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.tile{display:grid;grid-template-columns:76px minmax(0,1fr);gap:18px;padding:20px 20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);transition:border-color .2s}
.tile:hover{border-color:var(--ink-2)}
.tile .art{display:block;padding-top:2px}
.tile .art svg{width:76px;height:auto;display:block;transform-origin:50% 4%;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.tile:hover .art svg{transform:rotate(-7deg)}
.tbody{display:flex;flex-direction:column;min-width:0}
.cls{align-self:flex-start;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;padding:2px 6px;border:1px solid var(--line);border-radius:3px;color:var(--ink-2);white-space:nowrap}
.tile h3{font-family:var(--font-display);font-weight:600;font-size:1.02rem;letter-spacing:-.01em;margin:10px 0 6px}
.tile h3 a{text-decoration:none}
.tile h3 a:hover{color:var(--accent)}
.tile p.d{color:var(--ink-2);font-size:.9375rem;margin-bottom:12px}
.mlist{list-style:none;margin:0 0 auto;padding:0;border-top:1px solid var(--line)}
.mlist a{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 10px;padding:8px 0;border-bottom:1px dashed var(--line);text-decoration:none}
.mlist a:hover .mname{color:var(--accent)}
.mname{font-weight:500;font-size:.9375rem;min-width:0;flex:1 1 150px}
.mlist .mstat{margin-left:auto}
@media (max-width:480px){.tile{grid-template-columns:48px minmax(0,1fr);gap:14px;padding:16px}.tile .art svg{width:48px}}
.mbrand{color:var(--muted);font-weight:400;font-size:.8125rem;margin-right:3px}
.mstat{font-family:var(--font-mono);font-size:.8125rem;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.more{display:inline-block;margin-top:12px;font-weight:500;font-size:.875rem;color:var(--accent);text-decoration:none}
.more:hover{text-decoration:underline}
.tile.warn{border-style:dashed;background:repeating-linear-gradient(-45deg,transparent 0 12px,var(--warn-soft) 12px 14px),var(--surface)}
.warnline{display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:.9rem;color:var(--warn);margin-bottom:auto}
.empty{padding:48px 0;color:var(--ink-2)}
.empty button{margin-left:8px}
.btn{font:500 14px var(--font-body);padding:8px 14px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}

/* spec cards */
.specband{margin-top:56px;padding-top:40px;border-top:1px solid var(--line)}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px;margin-top:18px}
.scard{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-content:start;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;text-decoration:none;transition:border-color .2s}
.scard:hover{border-color:var(--accent)}
.scard .pict{grid-row:span 2;color:var(--accent);margin-top:2px}
.scard b{font-weight:600}
.scard span{grid-column:2;font-size:.875rem;color:var(--ink-2)}
.scard .unit{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-left:6px;font-weight:400}

/* detail pages */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;padding-top:24px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.crumbs a{color:var(--ink-2);text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.dhero{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:44px;align-items:start;padding-block:24px 8px}
.plate{display:grid;place-items:center;aspect-ratio:4/5;max-width:100%;border:1px solid var(--line);border-radius:8px;background-color:var(--surface);background-image:radial-gradient(var(--line) 1.3px,transparent 1.5px);background-size:20px 20px;background-position:10px 10px;padding:20px}
.plate svg{width:62%;height:auto}
.dinfo{display:grid;gap:14px;min-width:0}
.dinfo h1{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.875rem;font-weight:500;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);text-decoration:none}
a.tag:hover{border-color:var(--accent);color:var(--ink)}
.stamp{display:flex;flex-wrap:wrap;width:fit-content;max-width:100%;border:1px solid var(--line);border-radius:4px;background:linear-gradient(180deg,var(--surface-2),var(--surface));overflow:hidden}
.stamp a{display:flex;align-items:center;gap:8px;padding:9px 14px;border-right:1px solid var(--line);text-decoration:none;font-family:var(--font-mono);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;color:var(--ink);text-shadow:0 1px 0 var(--emboss)}
.stamp a:last-child{border-right:0}
.stamp a:hover{background:var(--accent-soft)}
.stamp .pict{color:var(--ink-2)}
.stamp small{font-weight:500;font-size:.75rem;color:var(--muted)}
.src{font-size:.8125rem;color:var(--muted)}
.src a{color:var(--ink-2)}
@media (max-width:780px){.dhero{grid-template-columns:1fr;gap:20px}.plate{aspect-ratio:auto;padding:24px}.plate svg{width:auto;max-width:150px}}

.sec{padding-top:44px}
.sec > h2{margin-bottom:18px}
.speclist{border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(96px,auto) minmax(0,1.15fr);gap:8px 24px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.slabel{display:flex;gap:12px;align-items:flex-start;min-width:0}
.slabel .pict{color:var(--ink-2);margin-top:2px}
.slabel a{font-weight:600;text-decoration:none}
.slabel a:hover{color:var(--accent)}
.slabel small{display:block;color:var(--muted);font-size:.8125rem}
.slabel small a{font-weight:400;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.sval{font-family:var(--font-mono);font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.sval small{font-size:.75rem;font-weight:500;color:var(--muted);margin-left:3px}
.stext{grid-column:2/-1;font-weight:500}
.stext small{display:block;color:var(--muted);font-weight:400;font-size:.8125rem}
.meter{position:relative;height:10px;background:var(--surface-2);border-radius:0 4px 4px 0}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:0 4px 4px 0}
.meter b{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--ink)}
.mcap{font-size:.75rem;color:var(--muted);margin-top:7px}
@media (max-width:640px){.srow{grid-template-columns:minmax(0,1fr) auto}.meterbox{grid-column:1/-1}.stext{grid-column:1/-1;padding-left:40px}}

.uses{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.use{padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:6px;display:grid;gap:8px;align-content:start}
.use h3{font-family:var(--font-display);font-weight:600;font-size:.98rem}
.use p{color:var(--ink-2);font-size:.9375rem}
.use .eyebrow{font-size:11px}

.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.mcard{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;text-decoration:none;transition:border-color .2s}
.mcard:hover{border-color:var(--accent)}
.mcard svg{width:40px;height:auto}
.mcard b{display:block;font-weight:600}
.mcard .mstat{margin-top:2px}

.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.cols2{grid-template-columns:1fr}}
.box{padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.box h3{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:10px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plist li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.plist li::before{font-family:var(--font-mono);font-weight:700;color:var(--muted)}
.plist.plus li::before{content:"+"}
.plist.minus li::before{content:"−"}
.plist.dot li::before{content:"";width:6px;height:6px;margin-top:.6em;background:var(--accent);border-radius:1px}
.plist.check li::before{content:"✓";color:var(--accent)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}
.cmp th,.cmp td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.cmp tr:last-child td{border-bottom:0}
.cmp th{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);vertical-align:bottom}
.cmp th a{color:var(--ink-2);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.cmp th a:hover{color:var(--accent)}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp td{font-family:var(--font-mono);font-size:.9rem}
.cmp td:first-child{font-family:var(--font-body);font-size:.9375rem}
.cmp td:first-child a{text-decoration:none;font-weight:600}
.cmp td:first-child a:hover{color:var(--accent)}
.cmp td.best{color:var(--accent);font-weight:700}
.cmp tbody tr:hover{background:var(--surface-2)}

/* spec page */
.spechero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding-block:24px 8px}
.bigpict{display:grid;place-items:center;width:120px;height:120px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--accent)}
.unitchip{display:inline-block;font-family:var(--font-mono);font-size:13px;font-weight:700;padding:3px 8px;border-radius:3px;background:var(--ink);color:var(--bg);vertical-align:middle;margin-left:10px;letter-spacing:.04em}
@media (max-width:560px){.spechero{grid-template-columns:1fr;gap:16px}.bigpict{width:84px;height:84px}}
.specgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.specgrid{grid-template-columns:1fr}}
.prose{display:grid;gap:22px;max-width:66ch}
.prose h3{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px}
.prose p{color:var(--ink)}
.prose .plist{gap:10px}
table.norm{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.norm th,.norm td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-size:.875rem}
.norm th:first-child,.norm td:first-child{text-align:left}
.norm th{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.norm td{font-family:var(--font-mono)}
.norm td:first-child{font-family:var(--font-body)}
.norm tr.hl td{color:var(--accent);font-weight:700}
.kinds{display:grid;gap:12px}
.kinds div{display:grid;gap:2px}
.kinds b{font-weight:600}
.kinds span{font-size:.875rem;color:var(--ink-2)}

    rSlingSoon:n=>[`Петле ${n} ${plural(n,'год','года','лет')}`,'Скоро петлю придётся заменить: предел для текстиля — 10 лет с даты производства.'],
    rNone:['Признаков износа нет','Пользуйтесь и продолжайте осматривать карабин перед каждым использованием.'],
    wHowTitle:'Как считается',
    wHow:['Алюминиевый карабин изнашивается в основном там, где по нему бежит верёвка: на рабочей поверхности появляется канавка. Её глубина и острые края — главный критерий списания.','Нагрузку на эту поверхность калькулятор оценивает в приведённых спусках: дни в месяц × спуски в день × месяцы, плюс половина спуска за каждый срыв. Поправки модели: песок ×4, скальная пыль и морской воздух ×1,5, сталь ×0,15, карабин, о который верёвка не трётся, ×0,1.','Вывод «списать» калькулятор делает только по результатам осмотра: канавка с острым краем, неисправная защёлка, трещины или деформация.','Petzl не ограничивает срок службы металлических изделий, а для текстиля и пластика ставит предел 10 лет с даты производства. Снаряжение, которое выдают другим людям, компетентный специалист должен подробно проверять не реже раза в 12 месяцев.'],
    wAssume:['Поправки износа — допущения атласа, а не данные производителей. Индекс показывает порядок величины, а не остаток прочности.','Канавку нельзя рассчитать: её нужно увидеть и нащупать. Осмотр всегда важнее цифр.','При любом сомнении карабин списывают: новый стоит дешевле последствий.'],
    cHowTitle:'Как считается',
    cHow:['Сорвавшийся пролетает высоту h и растягивает верёвку длиной L. Отношение f = h / L называют фактором срыва. В лазании он не бывает больше 2.','Пиковая сила на сорвавшегося: F = mg + √((mg)² + 2·mg·k·f), где k — жёсткость верёвки. Её получают из ударной силы по паспорту: в тесте UIAA груз 80 кг падает с фактором 1,77.','На верхнюю точку страховки действует почти вдвое больше силы: верёвка огибает карабин, и к рывку сорвавшегося добавляется натяжение со стороны страхующего. В расчёте взят коэффициент 1,66.','Жёсткость петли из дайнимы оценена по опубликованным тестам DMM: груз 80 кг при факторе 1 на петле 60 см дал около 18 кН.'],
    cAssumeTitle:'Чего модель не учитывает',
    cAssume:['Страховка считается жёсткой: нет проскальзывания верёвки в устройстве, подброса страхующего, затягивания узлов и трения о рельеф. В реальности сила обычно ниже.','Прочность — минимальное значение производителя для нового карабина. Износ, канавки от верёвки и нагрузка через ребро её снижают.','Это учебная модель для понимания порядка величин, а не инструмент для оценки реальной безопасности.'],

{id:'oval',group:'shape',chip:'EN 12275 · X',vis:{shape:'oval',gate:'straight',lock:'none',color:'#C9A227'},

 short:{ru:'Симметричная форма держит блок, жумар или узел строго по центру. Классика для полиспастов и спелеологии.',en:'A symmetrical shape keeps a pulley, ascender or knot centred. The classic for hauling systems and caving.'},
 long:{ru:'Овал — самая старая форма карабина. Из-за симметрии нагрузка делится между спинкой и защёлкой поровну, поэтому при том же весе овал слабее D-образного. Зато всё, что в нём висит, стоит ровно по центру и не перекашивается: блок-ролик не трётся щёчками, зажим не заваливается набок. В EN 12275 для овалов есть отдельный класс X с минимумом 18 кН вдоль спинки, но многие современные овалы проходят и по базовому классу B.',en:'The oval is the oldest carabiner shape. Because it is symmetrical, the spine and the gate share the load equally, so an oval is weaker than a D of the same weight. In return, anything hanging in it sits dead centre: a pulley doesn’t rub its side plates and a rope clamp doesn’t tip over. EN 12275 has a dedicated class X for ovals with an 18 kN major-axis minimum, though many modern ovals also meet basic class B.'},
 pros:{ru:['Блоки и зажимы стоят по центру','Снаряжение легко перекладывать с одного конца на другой','Узел остаётся там, где его завязали'],en:['Pulleys and clamps sit centred','Gear slides easily from end to end','Knots stay where you tie them']},

 long:{ru:'У D-образного карабина ось нагрузки смещена к спинке — самой толстой и прочной части корпуса. Поэтому D прочнее овала при меньшем весе. Асимметричный D (offset D) ещё и сужается к носику: защёлка открывается шире, корпус становится легче. На этой форме построены оттяжки, большинство муфтовых карабинов для станций и почти вся развеска трэд-снаряжения. Базовый класс EN 12275 B требует от 20 кН вдоль спинки и от 7 кН поперёк и с открытой защёлкой.',en:'A D shape pushes the load line towards the spine, the thickest and strongest part of the body, so a D is stronger than an oval at a lower weight. The offset D also narrows towards the nose, which widens the gate opening and trims weight further. Quickdraws, most anchor lockers and almost every trad rack are built on this shape. Basic class B in EN 12275 requires at least 20 kN along the spine and 7 kN cross-loaded or with the gate open.'},
 pros:{ru:['Лучшее соотношение веса и прочности','Широкое раскрытие у асимметричной версии','Самый большой выбор моделей'],en:['Best strength-to-weight ratio','Wide gate on the offset version','The widest choice of models']},

 long:{ru:'HMS — сокращение от немецкого Halbmastwurfsicherung, страховка полусхватывающим узлом. У нас его называют узлом UIAA, в англоязычной традиции — Munter hitch. Под этот узел и сделан широкий симметричный верх: верёвка переворачивается в нём при смене направления и не заклинивает. Грушевидные карабины почти всегда муфтовые, крупные и с большим раскрытием. Класс EN 12275 H требует от 20 кН вдоль, 7 кН поперёк и 6 кН с открытой защёлкой.',en:'HMS stands for the German Halbmastwurfsicherung, belaying with a Munter hitch. The wide, symmetrical top is shaped for that hitch: the rope flips through it when the direction changes and doesn’t jam. Pear carabiners are almost always locking, large and wide-gated. EN 12275 class H requires at least 20 kN major axis, 7 kN minor axis and 6 kN gate open.'},

 long:{ru:'Прямая защёлка — стандарт для верхнего карабина оттяжки, того, что встёгивается в шлямбур, и для развески снаряжения. Её удобно открывать, держа карабин за корпус, и сложнее случайно открыть верёвкой или рельефом. Литая защёлка тяжелее проволочной, поэтому сильнее подвержена хлёсту: при ударе карабина о скалу она может на долю секунды открыться по инерции.',en:'A straight gate is the standard for the bolt end of a quickdraw and for racking gear. It is easy to open while holding the body and harder to open by accident against the rope or rock. A solid gate is heavier than a wire one, so it is more prone to whiplash: it can open for a split second by inertia when the carabiner hits rock.'},

 long:{ru:'Вместо литой защёлки — петля из нержавеющей проволоки. Масса защёлки в разы меньше, поэтому при ударе о скалу она почти не открывается по инерции. Проволока не смерзается на холоде, а сам карабин весит 22–45 г. Отсюда популярность в трэде, альпинизме и ледолазании. Минус: тонкую проволоку сложнее поймать пальцами в толстых перчатках.',en:'Instead of a solid gate there is a loop of stainless wire. The gate is many times lighter, so it hardly opens by inertia when the carabiner strikes rock. Wire doesn’t freeze shut in the cold, and the carabiner itself weighs 22–45 g. Hence its popularity on trad, alpine and ice routes. The downside: thin wire is harder to grab in thick gloves.'},

 name:{ru:'Автоматическая муфта',en:'Auto-locking'},
 short:{ru:'Пружинная муфта закрывается сама. Открывается в 2 действия (Twist-Lock) или в 3 (Triact-Lock).',en:'A sprung sleeve locks by itself. Opens in two actions (Twist-Lock) or three (Triact-Lock).'},
 long:{ru:'Пружинная муфта встаёт на место сама, как только защёлка закрылась. Чтобы открыть, муфту поворачивают (два действия) или сдвигают и поворачивают (три действия). Это исключает ошибку «забыл закрутить». Цена — механизм боится песка, грязи и льда, а двухступенчатую муфту может провернуть трущаяся верёвка. Поэтому в промальпе и на спасработах стандартом стали трёхступенчатые муфты.',en:'A sprung sleeve snaps into place as soon as the gate closes. To open it you twist (two actions) or slide and twist (three actions). That rules out the forgot-to-lock error. The trade-off: the mechanism dislikes sand, mud and ice, and a running rope can twist a two-stage sleeve open. That is why rope access and rescue teams standardise on three-stage sleeves.'},
 pros:{ru:['Невозможно забыть закрыть','Быстро открыть одной рукой'],en:['Impossible to forget to lock','Quick to open one-handed']},
 cons:{ru:['Забивается песком, грязью и льдом','Двухступенчатую муфту может провернуть верёвка'],en:['Clogs with sand, mud and ice','A running rope can twist a two-stage sleeve open']},
 rules:{ru:['Не допускайте, чтобы верёвка тёрлась о муфту','Промывайте механизм пресной водой после грязи и песка'],en:['Keep the rope from rubbing the sleeve','Rinse the mechanism in fresh water after mud or sand']}},
{id:'magnetic',group:'lock',chip:'EN 12275 · H',vis:{shape:'hms',gate:'straight',lock:'magnet',color:'#33459E'},
 models:['bd-magnetron'],spheres:['gym','sport'],
 name:{ru:'Магнитная блокировка',en:'Magnetic locking'},
 short:{ru:'Два рычага с магнитами держат защёлку. Открывается сжатием одной рукой, закрывается и блокируется сама.',en:'Two magnetic arms hold the gate. Squeeze to open one-handed; it closes and locks by itself.'},
 long:{ru:'Система Magnetron от Black Diamond: по бокам защёлки два подпружиненных рычага, которые магниты удерживают в закрытом положении. Чтобы открыть, рычаги одновременно сжимают пальцами. Карабин закрывается и блокируется автоматически, а случайно открыть его трением верёвки почти невозможно: нужно сжать оба рычага сразу. Удобно там, где карабин пристёгивают и отстёгивают десятки раз за день.',en:'Black Diamond’s Magnetron system: two sprung arms beside the gate, held shut by magnets. Squeeze both at once to open. The carabiner closes and locks automatically, and rope friction can hardly open it because both arms must be pressed together. Ideal where a carabiner is clipped and unclipped dozens of times a day.'},
 pros:{ru:['Открывается одной рукой','Блокируется автоматически','Трение верёвки не открывает'],en:['Opens one-handed','Locks automatically','Rope friction won’t open it']},
 cons:{ru:['Тяжелее и дороже обычной муфты','Механизм нужно держать в чистоте'],en:['Heavier and pricier than a screwgate','The mechanism needs keeping clean']},
 rules:{ru:['Перед страховкой убедитесь, что оба рычага вернулись на место'],en:['Before belaying, check that both arms have snapped back']}},
{id:'belay',group:'lock',chip:'EN 12275 · H',vis:{shape:'hms',gate:'straight',lock:'screw',belay:'gate',color:'#9A6B3A'},
 models:['bd-gridlock','dmm-belay-master-2'],spheres:['gym','sport','alpine'],
 name:{ru:'Страховочный с фиксатором',en:'Anti-cross-load belay'},
 short:{ru:'Отдельная камера или клипса держит карабин в правильном положении и не даёт ему встать поперёк.',en:'A separate chamber or clip holds the carabiner in place so it can’t rotate into a cross-load.'},
 long:{ru:'Во время страховки карабин крутится в силовой петле беседки и может встать поперёк, где его прочность падает до 7–10 кН. Страховочные модели решают это конструкцией. Black Diamond GridLock отделяет петлю беседки внутренней защёлкой-камерой. DMM Belay Master 2 запирает её пластиковой клипсой, которая встаёт на место только при закрученной муфте. Хороший выбор для начинающих и для долгой страховки.',en:'While belaying, the carabiner rotates in the harness belay loop and can end up cross-loaded, where its strength drops to 7–10 kN. Belay-specific models fix this by design. The Black Diamond GridLock isolates the belay loop behind an internal gate. The DMM Belay Master 2 traps it with a plastic clip that only closes over a locked sleeve. A good choice for new belayers and long sessions.'},
 pros:{ru:['Защита от поперечной нагрузки','У клипсы Belay Master видно, закручена ли муфта'],en:['Protection from cross-loading','The Belay Master clip shows whether the sleeve is locked']},
 cons:{ru:['Тяжелее обычного HMS','Дольше пристёгивать и отстёгивать'],en:['Heavier than a plain HMS','Slower to clip and unclip']},
 rules:{ru:['Силовая петля беседки — в отдельную камеру, верёвка и устройство — в основной объём'],en:['Belay loop in the separate chamber; rope and device in the main basket']}},
{id:'viaferrata',group:'special',chip:'EN 12275 · K',vis:{shape:'hms',gate:'straight',lock:'wirelock',color:'#7FAE1F'},
 models:['petzl-vertigo','kong-tango'],spheres:['viaferrata'],
 name:{ru:'Для виа феррат (класс K)',en:'Via ferrata (class K)'},
 short:{ru:'Крупные карабины с автоматической блокировкой и большим раскрытием под стальной трос.',en:'Large self-locking carabiners with a gate wide enough for steel cable.'},
 long:{ru:'На виа феррате карабины самостраховки постоянно перестёгивают через анкеры троса, поэтому им нужна блокировка, которая закрывается сама, и раскрытие под толстые перила. EN 12275 выделяет такие карабины в класс K: от 25 кН вдоль спинки и от 8 кН с открытой защёлкой. Они всегда работают в паре с усом-амортизатором по EN 958. Без амортизатора даже короткий срыв на тросе даёт опасный рывок.',en:'On a via ferrata the lanyard carabiners are reclipped past every cable anchor, so they need a lock that closes by itself and a gate wide enough for thick cables. EN 12275 places them in class K: at least 25 kN major axis and 8 kN gate open. They always work with an energy-absorbing lanyard to EN 958. Without the absorber, even a short fall onto the cable produces a dangerous shock load.'},
 pros:{ru:['Открывается одной рукой','Блокируется автоматически','Большое раскрытие под трос'],en:['Opens one-handed','Locks automatically','Wide gate for the cable']},
 cons:{ru:['Тяжёлые','Узкая специализация'],en:['Heavy','Single-purpose']},
 rules:{ru:['Используйте только с усом-амортизатором по EN 958','Перестёгивайте карабины по одному, чтобы всегда оставаться пристёгнутым'],en:['Use only with an EN 958 energy-absorbing lanyard','Reclip one carabiner at a time so you are always attached']}},
{id:'steel',group:'special',chip:'EN 362 · ANSI',vis:{shape:'oval',gate:'straight',lock:'screw',color:'#7D8890'},
 models:['petzl-oxan','kong-ovalone','petzl-vulcan','petzl-go','petzl-delta'],spheres:['industrial','rescue','caving'],
 name:{ru:'Стальные',en:'Steel'},
 short:{ru:'В 2–3 раза тяжелее алюминиевых, зато прочнее и почти не изнашиваются. Промальп, спасработы, станции спуска.',en:'Two to three times heavier than aluminium, but stronger and nearly wear-proof. Rope access, rescue and lower-offs.'},
 long:{ru:'Сталь выдерживает 30–45 кН и в разы лучше сопротивляется истиранию: верёвка с песком не пропиливает в ней канавку, как в алюминии. Поэтому стальные карабины ставят туда, где через них постоянно бежит верёвка (станции спуска, полиспасты), где нужен запас под двоих (спасработы) и где карабин трётся о стальной трос или цепь. Обычно их сертифицируют по EN 362 и ANSI Z359.12 для работ на высоте.',en:'Steel holds 30–45 kN and resists abrasion many times better: gritty rope doesn’t saw a groove into it the way it does into aluminium. So steel goes where rope runs constantly (lower-offs, hauling systems), where a two-person load needs margin (rescue) and where the carabiner rubs against steel cable or chain. Steel connectors are usually certified to EN 362 and ANSI Z359.12 for work at height.'},
 pros:{ru:['Очень высокий запас прочности','Устойчивость к истиранию','Не боятся контакта со стальным тросом'],en:['Very high strength margin','Abrasion resistant','Fine against steel cable']},
 cons:{ru:['Тяжёлые: в атласе до 235 г','Обычная сталь ржавеет без ухода'],en:['Heavy: up to 235 g in this atlas','Plain steel rusts without care']},
 rules:{ru:['Ставьте сталь на постоянные точки, через которые бежит верёвка','После работы в сырости просушите карабин и смажьте шарнир'],en:['Use steel at fixed points where the rope runs','After wet work, dry the carabiner and oil the hinge']}},
{id:'quicklink',group:'special',chip:'EN 12275 · Q',vis:{shape:'link',gate:'none',lock:'quicklink',color:'#5E676E'},
 models:['petzl-go','petzl-delta'],spheres:['sport','caving','industrial'],
 name:{ru:'Рапид (резьбовое звено)',en:'Quick link (maillon)'},
 short:{ru:'Стальное звено с резьбовой гайкой вместо защёлки. Максимальная прочность при минимальном размере.',en:'A steel link with a threaded sleeve instead of a gate. Maximum strength in a minimal size.'},
 long:{ru:'Рапид (от французского maillon rapide) — звено с гайкой вместо защёлки. Когда гайка закручена, это сплошное кольцо, которое держит нагрузку в разных направлениях лучше обычного карабина: класс Q в EN 12275 требует от 25 кН вдоль и от 10 кН поперёк. Открывать рапид долго, поэтому его ставят туда, где перестёгивать не нужно: на станции спуска, в постоянную навеску пещер, для замыкания обвязок. С открытой гайкой рапид не держит заявленной нагрузки.',en:'A quick link (maillon rapide) has a threaded sleeve instead of a gate. Screwed shut, it is a closed ring that handles loads from several directions better than a carabiner: EN 12275 class Q requires at least 25 kN major and 10 kN minor axis. It is slow to open, so it goes where nothing needs reclipping: lower-off anchors, permanent cave rigging, closing harnesses. With the sleeve open it does not hold its rated load.'},
 pros:{ru:['Высокая прочность в разных направлениях','Компактный и недорогой','Подходит для постоянных точек'],en:['Strong in several directions','Compact and inexpensive','Good for permanent points']},
 cons:{ru:['Долго открывать','Бесполезен с незакрученной гайкой'],en:['Slow to open','Useless with the sleeve undone']},
 rules:{ru:['Закручивайте гайку до конца, при необходимости ключом','Не ставьте рапид туда, где нужно часто перестёгиваться'],en:['Screw the sleeve fully shut, with a spanner if needed','Don’t use one where you need to reclip often']}},
{id:'pulley',group:'special',chip:'EN 362 · EN 12278',vis:{shape:'dee',gate:'straight',lock:'screw',roller:true,color:'#4F8FD6'},
 models:['dmm-revolver','petzl-rollclip-z'],spheres:['trad','rescue','industrial','alpine'],
 name:{ru:'Карабин с роликом',en:'Pulley carabiner'},
 short:{ru:'Встроенный ролик снижает трение верёвки. Полиспасты, подъём грузов и маршруты с сильным изломом верёвки.',en:'A built-in sheave cuts rope friction. Hauling systems, lifting loads and wandering routes.'},
 long:{ru:'В корпус встроен ролик, по которому идёт верёвка. Трение в разы меньше, чем при перегибе верёвки через обычный карабин: КПД ролика Petzl Rollclip Z — 85%. Это нужно в полиспастах, где каждый процент КПД экономит силы, при подъёме грузов и на маршрутах с сильным изломом, где ролик в точке страховки уменьшает протяжку верёвки. Ролик обычно рассчитан на меньшую нагрузку, чем корпус: у DMM Revolver он держит до 11 кН при прочности карабина 24 кН.',en:'A sheave is built into the body and the rope runs over it. Friction is many times lower than when the rope bends over a plain carabiner: the Petzl Rollclip Z sheave is 85% efficient. That matters in hauling systems, where every percent of efficiency saves effort, when lifting loads, and on wandering routes, where a pulley at a runner cuts rope drag. The sheave is usually rated lower than the body: on the DMM Revolver it holds up to 11 kN while the carabiner is rated 24 kN.'},
 note:{title:{ru:'А если нужно выровнять разницу в весе?',en:'What about a weight difference between partners?'},text:{ru:'Ролик здесь не поможет, а навредит. Когда лазающий заметно тяжелее страхующего, трение на первой точке нужно не убрать, а добавить, чтобы страхующего меньше подбрасывало. Для этого есть отдельные устройства, например Edelrid Ohm: его встёгивают в первый шлямбур, при срыве он подтормаживает верёвку, а при выдаче почти не мешает.',en:'A pulley won’t help here; it makes things worse. When the climber is much heavier than the belayer, you want more friction at the first bolt, not less, so the belayer is lifted less. Dedicated devices such as the Edelrid Ohm do this: clipped into the first bolt, it brakes the rope in a fall and barely gets in the way when paying out.'}},
 pros:{ru:['Высокий КПД в полиспасте','Меньше протяжки верёвки на извилистом маршруте','Блок и карабин в одном предмете'],en:['High efficiency in hauling systems','Less rope drag on wandering routes','Pulley and carabiner in one piece']},
 cons:{ru:['Тяжелее обычного карабина','Ролик держит меньше, чем корпус','Убирает трение, которое помогает страховать партнёра тяжелее себя'],en:['Heavier than a plain carabiner','The sheave is rated lower than the body','Removes friction that helps when belaying a heavier partner']},
 rules:{ru:['Верёвка должна лежать на ролике, а не на корпусе','Проверяйте диаметр верёвки: Petzl Rollclip Z рассчитан на 7–13 мм','Не ставьте ролик на первую точку, если страхуете партнёра тяжелее себя'],en:['The rope must run on the sheave, not the body','Check the rope diameter: the Petzl Rollclip Z takes 7–13 mm','Don’t put a pulley on the first bolt when belaying a heavier partner']}},
{id:'spur',group:'special',chip:'EN 362 · EN 12275',vis:{shape:'dee',gate:'straight',lock:'twist',spur:true,color:'#D9822B'},
 models:['petzl-freino','petzl-freino-z'],spheres:['rescue','industrial'],
 name:{ru:'Карабин со шпорой',en:'Friction-spur carabiner'},
 short:{ru:'На корпусе есть изогнутая шпора. Верёвку заводят за неё, чтобы добавить трения при спуске с грузом.',en:'A curved spur on the body. Wrap the rope round it to add friction when descending with a load.'},
 long:{ru:'Шпора — изогнутый выступ на корпусе. Верёвку после спускового устройства заводят за шпору, и трения становится больше: спуск идёт медленнее, а тяжёлый груз или пострадавшего проще удержать. Включить и выключить шпору можно на ходу, не отстёгивая спусковое устройство. Такие карабины работают в паре с определёнными спусковыми устройствами: Petzl Freino Z с Triact-Lock совместим с I’D и RIG. Классического Freino (M42, Twist-Lock) на сайте Petzl больше нет, его место занял Freino Z.',en:'The spur is a curved horn on the body. The rope coming out of the descender is wrapped round it, adding friction: the descent slows and a heavy load or casualty is easier to hold. The spur can be engaged and released on the move without unclipping the descender. These carabiners pair with specific descenders: the Petzl Freino Z with Triact-Lock works with the I’D and RIG. The classic Freino (M42, Twist-Lock) is no longer on Petzl’s website; the Freino Z replaced it.'},
 pros:{ru:['Добавочное трение без отдельного тормоза','Включается и выключается на ходу','Карабин и тормоз в одном предмете'],en:['Extra friction without a separate brake','Engages and releases on the move','Carabiner and brake in one piece']},
 cons:{ru:['Работает только с совместимыми спусковыми устройствами','Тяжелее и дороже обычного муфтового'],en:['Works only with compatible descenders','Heavier and pricier than a plain locker']},
 rules:{ru:['Проверьте совместимость со своим спусковым устройством по инструкции производителя','Отработайте включение шпоры невысоко над землёй, прежде чем работать на высоте'],en:['Check compatibility with your descender in the manufacturer’s instructions','Practise engaging the spur close to the ground before working at height']}},
{id:'accessory',group:'special',chip:{ru:'без сертификата',en:'not certified'},vis:{shape:'oval',gate:'straight',lock:'none',color:'#A3ABB0',dashed:true},
 models:[],spheres:[],
 name:{ru:'Аксессуарный (брелок)',en:'Accessory (non-rated)'},
 short:{ru:'Брелоки для ключей и бутылок. Нет маркировки кН — значит, не держит человека.',en:'Keyring and bottle clips. No kN marking means it won’t hold a person.'},
 long:{ru:'Похожи на настоящие, но не сертифицированы по EN 12275, EN 362 или UIAA и не несут маркировки прочности на спинке. Многие сделаны из литого сплава и могут сломаться уже под весом человека. Для страховки, самостраховки и подвеса снаряжения на высоте их использовать нельзя. Правило простое: нет выбитых кН и номера стандарта — нет доверия.',en:'They look like the real thing but carry no EN 12275, EN 362 or UIAA certification and no strength marking on the spine. Many are cast alloy and can break under body weight alone. Never use them for belaying, tethering or hanging gear at height. The rule is simple: no stamped kN and no standard number means no trust.'},
 pros:{ru:['Дёшево','Удобно для ключей, бутылок и мелочей'],en:['Cheap','Handy for keys, bottles and odds and ends']},
 cons:{ru:['Не держит нагрузку человека','Никаких гарантий прочности'],en:['Won’t hold a person’s weight','No strength guarantee at all']},
 rules:{ru:['Держите брелоки отдельно от страховочного снаряжения, чтобы не перепутать'],en:['Keep them away from your climbing gear so they never get mixed up']},
 checklist:{ru:['На спинке выбиты значения прочности в кН по трём направлениям','Указан стандарт: EN 12275, EN 362 или знак UIAA','Есть название производителя и номер партии','В комплекте инструкция с правилами эксплуатации и проверки'],en:['Strength in kN is stamped on the spine for three directions','A standard is marked: EN 12275, EN 362 or the UIAA label','The maker’s name and a batch number are present','It comes with instructions for use and inspection']}}
];

/* ---------- specifications ---------- */
const SPECS = [
{id:'major',unit:'kN',num:true,
 name:{ru:'Прочность вдоль спинки',en:'Major-axis strength'},
 short:{ru:'Разрывная нагрузка закрытого карабина, когда сила приложена вдоль длинной оси.',en:'Breaking load of a closed carabiner pulled along its long axis.'},
 what:{ru:'Главная цифра на спинке карабина. Показывает, при какой нагрузке разрушается карабин с закрытой защёлкой, если сила приложена вдоль длинной оси, ближе к спинке. 1 кН — примерно 102 кгс, так что 24 кН соответствуют весу около 2,4 тонны.',en:'The headline number on the spine: the load at which a closed carabiner breaks when pulled along its long axis, close to the spine. 1 kN is about 102 kgf, so 24 kN is roughly the weight of 2.4 tonnes.'},
 how:{ru:'Карабин надевают на два стальных стержня диаметром 12 мм и растягивают на разрывной машине. Многие производители указывают не среднее, а гарантированное значение: средний результат серии минус три стандартных отклонения. Ниже этой цифры статистически не опускается практически ни один экземпляр.',en:'The carabiner is placed over two 12 mm steel pins and pulled apart on a test machine. Many manufacturers publish a guaranteed figure rather than the average: the batch mean minus three standard deviations, so practically no individual carabiner falls below it.'},
 affects:{ru:['Запас при срыве. На верхнюю точку страховки действует почти вдвое больше силы, чем на лазающего: верёвка огибает карабин, как блок. Но даже жёсткий срыв на динамической верёвке с живой страховкой обычно не доходит до 20 кН, так что 20+ кН — это запас, а не рабочая нагрузка.','Запас на износ и неправильную нагрузку. Канавки от верёвки, нагрузка на носик или через рычаг заметно снижают реальную прочность.','Работа со статикой. Рывок на статической верёвке или петле самостраховки может быть в разы жёстче, чем на динамической.'],en:['Margin in a fall. The top piece sees almost twice the force on the climber, because the rope bends over the carabiner like a pulley. Even so, a hard fall on a dynamic rope with a soft belay rarely reaches 20 kN, so 20+ kN is margin, not working load.','Margin for wear and bad loading. Rope grooves, nose loading or levering over an edge noticeably reduce real strength.','Static systems. A shock on a static rope or tether can be many times harsher than on a dynamic rope.']}},
{id:'minor',unit:'kN',num:true,
 name:{ru:'Прочность поперёк',en:'Minor-axis strength'},
 short:{ru:'Сколько держит карабин, нагруженный поперёк, между спинкой и защёлкой.',en:'What a carabiner holds when loaded across, between spine and gate.'},
 what:{ru:'Если карабин развернулся и нагрузка пошла поперёк, сила давит на защёлку и её шарнир. Прочность падает в 2–4 раза: типично 7–10 кН против 20–27 кН вдоль спинки у алюминиевых моделей.',en:'If the carabiner rotates and is loaded across its width, the force bears on the gate and its hinge. Strength drops two to four times: typically 7–10 kN against 20–27 kN along the spine for aluminium models.'},
 how:{ru:'Испытание как для продольной оси, но стержни ставят поперёк корпуса: один упирается в спинку, другой в защёлку.',en:'Tested like the major axis, but with the pins set across the body: one against the spine, the other against the gate.'},
 affects:{ru:['Страховка через силовую петлю беседки: карабин крутится и может встать поперёк. Отсюда страховочные модели с фиксатором.','Станции и точки: карабин, упёршийся в скалу или проушину, может получить поперечную нагрузку или нагрузку через рычаг.','Форма и ориентация: узкую часть D-образного карабина держите у рабочей точки.'],en:['Belaying from the harness belay loop: the carabiner rotates and can end up crosswise. Hence belay models with an anti-cross-load feature.','Anchors and points: a carabiner pressed against rock or a hanger can be cross-loaded or levered.','Shape and orientation: keep the narrow end of a D at the working point.']}},
{id:'open',unit:'kN',num:true,
 name:{ru:'Прочность с открытой защёлкой',en:'Gate-open strength'},
 short:{ru:'Сколько держит карабин, если в момент рывка защёлка открыта.',en:'What the carabiner holds if the gate is open at the moment of loading.'},
 what:{ru:'Без защёлки карабин превращается в крюк, и нагрузку несёт только изгибающаяся спинка. Типично 6–10 кН у алюминиевых моделей, а это уже сопоставимо с силами реального срыва.',en:'Without its gate the carabiner becomes a hook and only the bending spine carries the load. Typically 6–10 kN for aluminium models, which is close to real fall forces.'},
 how:{ru:'Продольное испытание на двух стержнях, при котором защёлку фиксируют в открытом положении.',en:'A major-axis pull test with the gate held fully open.'},
 affects:{ru:['Хлёст защёлки. При ударе карабина о скалу защёлка может на долю секунды открыться по инерции. Если рывок приходит в этот момент, работает именно эта цифра.','Защёлка на рельефе. Карабин оттяжки может лечь на выступ, и тот удерживает защёлку открытой.','Проволочные защёлки легче литых и меньше подвержены хлёсту, поэтому на практике открываются реже.'],en:['Gate whiplash. When a carabiner hits rock, the gate can open for a split second by inertia. If the load arrives at that moment, this is the number that counts.','Gate held open by rock. A quickdraw carabiner can lie across a bulge that keeps the gate pressed open.','Wire gates are lighter than solid ones and less prone to whiplash, so in practice they open less often.']}},
{id:'weight',unit:'g',num:true,
 name:{ru:'Вес',en:'Weight'},
 short:{ru:'Масса карабина. В атласе от 22 до 235 г.',en:'The carabiner’s mass. In this atlas, 22 to 235 g.'},
 what:{ru:'Масса одного карабина в граммах. Разброс огромный: проволочные весят 22–45 г, стальные — до 235 г. У муфтовой и автоматической версий одной модели вес разный.',en:'The mass of one carabiner in grams. The range is huge: wiregates weigh 22–45 g, steel models up to 235 g. Screwgate and auto-locking versions of one model differ.'},
 how:{ru:'Производитель взвешивает серийный экземпляр. Цвет анодирования и маркировка на вес почти не влияют.',en:'The manufacturer weighs a production sample. Anodising colour and markings make almost no difference.'},
 affects:{ru:['Вес всей развески: 30 карабинов по 50 г — это 1,5 кг, по 28 г — 840 г.','Износ: у лёгких карабинов тоньше профиль под верёвкой, канавка протирается быстрее и может стать острой.','Удобство: крупный карабин легче схватить в перчатках и проще открыть.'],en:['Rack weight: 30 carabiners at 50 g weigh 1.5 kg; at 28 g, 840 g.','Wear: light carabiners have a thinner rope-bearing surface, so grooves form faster and can turn sharp.','Handling: a bigger carabiner is easier to grab and open in gloves.']}},
{id:'gate',unit:'mm',num:true,
 name:{ru:'Раскрытие защёлки',en:'Gate opening'},
 short:{ru:'Просвет между носиком и полностью открытой защёлкой.',en:'Clearance between the nose and the fully open gate.'},
 what:{ru:'Максимальный зазор, через который можно завести верёвку, петлю или анкер. В атласе — от 10 мм у треугольного рапида до 30 мм у проволочного Mammut Crag Wire.',en:'The largest gap you can pass a rope, sling or anchor through. In this atlas, from 10 mm on a triangular quick link to 30 mm on the Mammut Crag Wire.'},
 how:{ru:'Защёлку открывают до упора и измеряют расстояние от носика до внутренней поверхности защёлки в миллиметрах.',en:'The gate is opened fully and the distance from the nose to the inside of the gate is measured in millimetres.'},
 affects:{ru:['Встёгивание толстых точек: деревья, балки, широкие анкеры, несколько петель сразу.','Работа в перчатках и на морозе.','Скорость встёжки верёвки: широкий зев прощает неточное движение.','Компромисс: большое раскрытие означает длинный ход защёлки и чуть больший вес.'],en:['Clipping thick points: trees, beams, wide anchors, several slings at once.','Working in gloves and in the cold.','Clipping speed: a wide gate forgives a sloppy movement.','The trade-off: a wide opening means a longer gate stroke and a little more weight.']}},
{id:'material',unit:null,num:false,
 name:{ru:'Материал',en:'Material'},
 short:{ru:'Алюминиевый сплав или сталь. Определяет вес, износ и запас прочности.',en:'Aluminium alloy or steel. Sets weight, wear and strength margin.'},
 what:{ru:'Почти все карабины для лазания делают из термоупрочнённого алюминиевого сплава серии 7075. Стальные — из легированной или нержавеющей стали; рапиды обычно оцинковывают.',en:'Almost all climbing carabiners are made from heat-treated 7075-series aluminium alloy. Steel ones use alloy or stainless steel; quick links are usually galvanised.'},
 how:{ru:'Корпус получают горячей штамповкой, затем термообрабатывают и анодируют. Профиль в форме двутавра (I-beam) убирает металл там, где он не несёт нагрузку.',en:'The body is hot-forged, heat-treated and anodised. An I-beam profile removes metal where it carries no load.'},
 affects:{ru:['Вес: сталь в 2–3 раза тяжелее алюминия при той же форме.','Износ: верёвка с песком пропиливает алюминий и оставляет острую канавку. Сталь на станциях спуска служит в разы дольше.','Контакт с металлом: стальной трос или цепь быстро стирают алюминий.','Коррозия: алюминий защищает анодирование, обычную сталь — цинк.'],en:['Weight: steel is two to three times heavier than aluminium for the same shape.','Wear: gritty rope saws into aluminium and leaves a sharp groove. Steel lasts many times longer at lower-offs.','Metal contact: steel cable or chain quickly wears aluminium away.','Corrosion: anodising protects aluminium; zinc protects plain steel.']}},
{id:'nose',unit:null,num:false,
 name:{ru:'Носик',en:'Nose'},
 short:{ru:'Как защёлка сцепляется с корпусом: крючок или гладкий замок Keylock.',en:'How the gate engages the body: a hooked notch or a smooth keylock.'},
 what:{ru:'Классический носик с выемкой держит защёлку штифтом, который заходит в крючок. В системе Keylock носик и защёлка сопряжены гладким замком без выступов. У проволочных защёлок есть свои гладкие решения: проволока заходит под выступ корпуса.',en:'A classic notched nose holds the gate with a pin that drops into a hook. In a keylock system the nose and gate mate in a smooth joint with no protrusions. Wiregates have their own clean designs, where the wire tucks under a hood on the body.'},
 how:{ru:'Это особенность конструкции, а не измеряемая величина. Производители указывают её в описании модели.',en:'This is a design feature rather than a measured value. Manufacturers state it in the product description.'},
 affects:{ru:['Зацепы: крючок цепляется за проушину шлямбура, петли и тросики закладок, когда карабин выстёгивают.','Скорость работы: гладкий носик легко выходит из петли станции.','В атласе тип носика указан только там, где его подтверждает производитель.'],en:['Snagging: a hook catches on bolt hangers, slings and nut wires as the carabiner is unclipped.','Speed: a smooth nose slides out of an anchor sling easily.','This atlas lists the nose type only where the manufacturer confirms it.']}},
{id:'lock',unit:null,num:false,
 name:{ru:'Блокировка',en:'Locking'},
 short:{ru:'Механизм, который не даёт защёлке открыться: муфта, автомат, магниты или гайка.',en:'What stops the gate opening: a sleeve, an auto-lock, magnets or a nut.'},
 what:{ru:'Блокировка нужна везде, где карабин не дублирован: страховочное устройство, самостраховка, станция, точка подвеса. Варианты различаются скоростью работы и тем, как переносят грязь и случайное касание.',en:'Locking is needed wherever the carabiner isn’t backed up: belay device, tether, anchor, hang point. The systems differ in speed and in how they cope with dirt and accidental contact.'},
 how:{ru:'Стандарты EN 12275 и EN 362 задают требования к запирающимся защёлкам, а тип механизма указывает производитель.',en:'EN 12275 and EN 362 set requirements for locking gates; the manufacturer states the mechanism type.'},
 affects:{ru:['Ручная муфта надёжна в грязи и на морозе, но её можно забыть закрыть.','Автоматические муфты исключают эту ошибку, но боятся песка и льда.','Двухступенчатую муфту может провернуть трущаяся верёвка, поэтому для работ на высоте выбирают трёхступенчатые.'],en:['A manual sleeve is reliable in mud and frost, but you can forget to lock it.','Auto-locking sleeves remove that error but dislike sand and ice.','A running rope can twist a two-stage sleeve open, so work at height uses three-stage sleeves.']}},
{id:'standard',unit:null,num:false,
 name:{ru:'Сертификация',en:'Certification'},
 short:{ru:'По какому стандарту карабин испытан и для чего допущен.',en:'Which standard it was tested to and what it is approved for.'},
 what:{ru:'Стандарт задаёт методику испытаний и минимальные значения прочности. Номер стандарта и класс выбивают на корпусе рядом с цифрами прочности.',en:'A standard sets the test method and minimum strengths. Its number and class are stamped on the body next to the strength figures.'},
 how:{ru:'Независимая лаборатория испытывает образцы модели по методике стандарта, после чего производитель получает сертификат и право на маркировку.',en:'An independent lab tests samples of the model to the standard’s method; the manufacturer then receives a certificate and the right to mark it.'},
 affects:{ru:['Допуск к работе: работодатели и инспекторы требуют EN 362, в США — ANSI Z359.12.','Класс EN 12275 подсказывает назначение: H — под узел UIAA, K — для виа феррат, Q — резьбовые звенья.','Нет маркировки стандарта — это не средство защиты, даже если карабин выглядит как настоящий.'],en:['Approval for work: employers and inspectors require EN 362, or ANSI Z359.12 in the US.','The EN 12275 class hints at the purpose: H for Munter hitch, K for via ferrata, Q for screw links.','No standard marking means it is not safety equipment, however real it looks.']}}
];
const SBY = Object.fromEntries(SPECS.map(s=>[s.id,s]));
const STANDARDS = [
 {k:'EN 12275',d:{ru:'Европейский стандарт альпинистских соединительных элементов. Классы B, H, K, X, Q и другие.',en:'European standard for mountaineering connectors. Classes B, H, K, X, Q and others.'}},
 {k:'UIAA',label:'UIAA 121',d:{ru:'Стандарт Международной федерации альпинизма, построен на EN 12275 с дополнительными требованиями.',en:'The International Climbing and Mountaineering Federation’s standard, built on EN 12275 with extra requirements.'}},
 {k:'EN 362',d:{ru:'Соединительные элементы средств защиты от падения с высоты: промальп и работы на высоте.',en:'Connectors for personal fall-protection equipment: rope access and work at height.'}},
 {k:'ANSI Z359.12',d:{ru:'Американский промышленный стандарт. Защёлка должна выдерживать 16 кН (3600 lbf) фронтальной и боковой нагрузки.',en:'US industrial standard. The gate must withstand 16 kN (3,600 lbf) of face and side load.'}},
 {k:'NFPA 2500',d:{ru:'Американский стандарт для спасательного снаряжения (ранее NFPA 1983).',en:'US standard for rescue equipment (formerly NFPA 1983).'}},

const state = {lang:'ru', sphere:'all', brand:'all', q:'', route:'',
  calc:{model:'petzl-djinn', mass:80, link:'dyn', impact:8.8, len:10, fall:4, pos:'top'},
  wear:{model:'dmm-alpha-sport', role:'rope', months:24, days:6, lowers:3, falls:60, hard:1, env:'rock', drop:false, steel:false, groove:'shiny', gate:'ok', body:'scratch', sling:true, slingYears:4}};
try{const s=localStorage.getItem('carabiner-atlas-lang');if(s==='ru'||s==='en')state.lang=s;}catch(e){}
const L = o => (o && typeof o==='object' && 'ru' in o) ? o[state.lang] : o;
const T = k => UI[state.lang][k];
const U = u => u ? T(u) : '';
let heroTimer = null;

/* ---------- drawing ---------- */
const SHAPES = {
  oval:{d:'M92 64 L92 52 A32 32 0 0 0 28 52 L28 148 A32 32 0 0 0 92 148 L92 136',n:[92,64],h:[92,136],st:[28,142,-90]},
  dee:{d:'M78 140 C78 174 30 182 30 148 L30 52 C30 16 96 14 96 62',n:[96,62],h:[78,140],st:[30,142,-90]},
  hms:{d:'M98 80 C102 32 62 14 42 20 C24 26 20 46 24 66 L40 156 C44 182 82 184 85 158 L86 150',n:[98,80],h:[86,150],st:[38.2,146,-100.1]},
  link:{d:'M88 82 L88 54 A28 28 0 0 0 32 54 L32 146 A28 28 0 0 0 88 146 L88 118',n:[88,82],h:[88,118],st:[32,136,-90]},
  delta:{d:'M87 130 L96 162 L24 162 L60 34 L72 76',n:[72,76],h:[87,130],st:null}
};
let UID = 0;
function biner(v, o={}){
  const S = SHAPES[v.shape], id = 'cb'+(++UID), c = v.color;
  const [hx,hy] = S.h, [nx,ny] = S.n, dx = nx-hx, dy = ny-hy, len = Math.hypot(dx,dy);
  const ux = dx/len, uy = dy/len, px = -uy, py = ux;
  const P = (t,off=0) => [+(hx+dx*t+px*off).toFixed(2), +(hy+dy*t+py*off).toFixed(2)];
  const pt = (t,off) => P(t,off).join(' ');
  const bw = v.dashed ? 7 : 11, dash = v.dashed ? ' stroke-dasharray="15 7"' : '';
  let s = `<svg class="biner" viewBox="${o.vb||'0 0 120 200'}"${o.size?` width="${o.size}"`:''} role="img" aria-label="${esc(o.label||'')}" focusable="false">`;
  s += `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${shade(c,.5)}"/><stop offset=".45" stop-color="${c}"/><stop offset="1" stop-color="${shade(c,-.42)}"/></linearGradient></defs>`;
  s += `<path d="${S.d}" fill="none" stroke="rgba(0,0,0,.13)" stroke-width="${bw}" stroke-linecap="round" stroke-linejoin="round" transform="translate(3 4)"${dash}/>`;
  if(v.belay==='gate') s += `<path d="M37 136 Q60 118 88 128" fill="none" stroke="#6F797F" stroke-width="3" stroke-linecap="round"/>`;
  s += `<path d="${S.d}" fill="none" stroke="url(#${id})" stroke-width="${bw}" stroke-linecap="round" stroke-linejoin="round"${dash}/>`;
  s += `<path d="${S.d}" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-2 -2)"${dash}/>`;
  if(v.roller){const [rx0,ry0]={dee:[50,151],hms:[62,158]}[v.shape]||[60,156];s += `<circle cx="${rx0}" cy="${ry0}" r="10" fill="#C9D0D4" stroke="#6F797F" stroke-width="2"/><circle cx="${rx0}" cy="${ry0}" r="3" fill="#6F797F"/>`;}
  if(v.spur) s += `<path d="M30 100 C12 96 6 114 14 128" fill="none" stroke="url(#${id})" stroke-width="8" stroke-linecap="round"/>`;
  if(o.stamp && S.st){const [x,y,a]=S.st;s += `<text transform="translate(${x} ${y}) rotate(${a})" font-family="JetBrains Mono, ui-monospace, monospace" font-size="5.6" font-weight="700" letter-spacing=".3" fill="#fff" fill-opacity=".85" dominant-baseline="central">${esc(o.stamp)}</text>`;}
  let g = '';
  if(v.gate==='straight') g += `<path d="M${hx} ${hy} L${nx} ${ny}" stroke="#AEB6BB" stroke-width="6" stroke-linecap="round"/><path d="M${pt(.05,-1.3)} L${pt(.95,-1.3)}" stroke="#fff" stroke-opacity=".65" stroke-width="1.3" stroke-linecap="round"/>`;
  if(v.gate==='bent'){const [cx,cy]=P(.5,-11);g += `<path d="M${hx} ${hy} Q${cx} ${cy} ${nx} ${ny}" fill="none" stroke="#AEB6BB" stroke-width="6" stroke-linecap="round"/>`;}
  if(v.gate==='wire') g += `<path d="M${pt(0,2.6)} L${pt(1,2.6)} L${pt(1,-2.6)} L${pt(0,-2.6)}" fill="none" stroke="#C5CCD0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const sleeve = (t0,t1,w,col) => `<path d="M${pt(t0)} L${pt(t1)}" stroke="${col}" stroke-width="${w}"/>`;
  if(v.lock==='screw'){g += sleeve(.5,.93,12,'#9AA3A9');for(const t of [.58,.67,.76,.85]) g += `<path d="M${pt(t,-6)} L${pt(t+.025,6)}" stroke="#5B646A" stroke-width="1.1"/>`;}
  if(v.lock==='twist'){g += sleeve(.45,.9,12,'#8F989E')+`<path d="M${pt(.52,-6)} L${pt(.72,6)}" stroke="#5B646A" stroke-width="1.6"/>`;const [cx,cy]=P(.82);g += `<circle cx="${cx}" cy="${cy}" r="1.8" fill="#5B646A"/>`;}
  if(v.lock==='wirelock'){g += sleeve(.6,.9,11,'#8F989E')+`<path d="M${pt(.15,-6.5)} L${pt(.62,-6.5)}" stroke="#C5CCD0" stroke-width="1.8" stroke-linecap="round"/>`;}
  if(v.lock==='lever') g += `<path d="M${pt(.12,7.5)} L${pt(.6,7.5)}" stroke="#4A535A" stroke-width="5" stroke-linecap="round"/>`;
  if(v.lock==='magnet'){for(const off of [-6.5,6.5]) g += `<path d="M${pt(.18,off)} L${pt(.78,off)}" stroke="#4A535A" stroke-width="3.2" stroke-linecap="round"/>`;}
  if(v.lock==='quicklink'){g += sleeve(-.14,1.14,14,'#9AA3A9');for(const t of [0,.18,.36,.54,.72,.9]) g += `<path d="M${pt(t,-7)} L${pt(t+.06,7)}" stroke="#5B646A" stroke-width="1"/>`;}
  s += o.hero ? `<g class="gate" style="transform-origin:${hx<nx?'0%':'100%'} 100%">${g}</g>` : g;
  if(v.belay==='clip') s += `<path d="M34 146 Q58 170 85 152" fill="none" stroke="#D23B2F" stroke-width="5" stroke-linecap="round" opacity=".92"/>`;
  if(o.hero){
    s += `<g class="ax ax-major"><path d="M10 46 V154"/><path d="M5 54 L10 42 L15 54"/><path d="M5 146 L10 158 L15 146"/></g>`;
    s += `<g class="ax ax-minor"><path d="M40 104 H84"/><path d="M46 99 L39 104 L46 109"/><path d="M78 99 L85 104 L78 109"/></g>`;
    const th = -24*Math.PI/180, rx = (hx+dx*Math.cos(th)-dy*Math.sin(th)).toFixed(1), ry = (hy+dx*Math.sin(th)+dy*Math.cos(th)).toFixed(1);
    s += `<g class="ax ax-open"><path d="M${nx} ${ny} A${len.toFixed(1)} ${len.toFixed(1)} 0 0 0 ${rx} ${ry}"/></g>`;
  }
  return s + '</svg>';
}
function picto(kind, size=24){
  const a = `fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"`;
  const body = '<rect x="3" y="5" width="26" height="14" rx="7"/>';
  const P = {
    major: body+'<path d="M8 12 H24 M10.5 9.5 L8 12 L10.5 14.5 M21.5 9.5 L24 12 L21.5 14.5"/>',
    minor: body+'<path d="M16 1.5 V22.5 M13.5 4 L16 1.5 L18.5 4 M13.5 20 L16 22.5 L18.5 20"/>',
    open: '<path d="M10 5 A7 7 0 0 0 10 19 H22 A7 7 0 0 0 22 5"/><path d="M22 5 L13 10.5"/>',
    weight: '<path d="M9.5 9 H22.5 L25.5 21 H6.5 Z"/><circle cx="16" cy="5.5" r="2.5"/>',
    gate: '<path d="M5 4 V20 M27 4 V20 M8.5 12 H23.5 M11 9.5 L8.5 12 L11 14.5 M21 9.5 L23.5 12 L21 14.5"/>',
    material: '<path d="M16 2.5 L24.5 7.25 V16.75 L16 21.5 L7.5 16.75 V7.25 Z M16 2.5 V12 M7.5 7.25 L16 12 L24.5 7.25"/>',
    nose: '<path d="M4 17 H20 Q27 17 27 11 Q27 5 20 5 H11"/><path d="M11 5 L17 11"/>',
    lock: '<rect x="5" y="7" width="22" height="10" rx="2"/><path d="M11 7 L13 17 M16 7 L18 17 M21 7 L23 17"/>',
    standard: '<path d="M16 2.5 L25 6 V11.5 C25 16.5 21 20 16 21.5 C11 20 7 16.5 7 11.5 V6 Z"/><path d="M12 12 L15 15 L20.5 8.5"/>'
  };
  return `<svg class="pict" width="${size}" height="${size*0.75}" viewBox="0 0 32 24" ${a} aria-hidden="true">${P[kind]||''}</svg>`;
}
function logoSVG(){
  const S = SHAPES.dee;
  return `<svg viewBox="0 0 120 200" width="14" height="23" aria-hidden="true"><path d="${S.d}" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/><path d="M${S.h.join(' ')} L${S.n.join(' ')}" stroke="currentColor" stroke-width="9" stroke-linecap="round" opacity=".45"/></svg>`;
}
function setFavicon(){
  const S = SHAPES.dee;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 200 200"><path d="${S.d}" fill="none" stroke="#E2741B" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M${S.h.join(' ')} L${S.n.join(' ')}" stroke="#9AA3A9" stroke-width="12" stroke-linecap="round"/></svg>`;
  let link = document.querySelector('link[rel="icon"]');
  if(!link){link = document.createElement('link');link.rel = 'icon';(document.head||document.documentElement).appendChild(link);}
  link.type = 'image/svg+xml';
  link.href = 'data:image/svg+xml,'+encodeURIComponent(svg);
}

/* ---------- data helpers ---------- */
const typeModels = t => t.models.map(id=>MBY[id]).filter(Boolean);
const modelTypes = m => TYPES.filter(t=>t.models.includes(m.id));
const modelSpheres = m => m.uses.map(u=>u.s);
const fmt = v => v==null ? '—' : (state.lang==='ru' ? String(v).replace('.',',') : String(v));
const val = (m,k,unit) => m[k]==null ? '—' : `${fmt(m[k])}${unit?` <small>${U(unit)}</small>`:''}`;
function stdTokens(m){return STANDARDS.filter(s=>m.standard.includes(s.k)).map(s=>s.k);}

/* ---------- shared fragments ---------- */
function crumbs(items){
  return `<nav class="crumbs" aria-label="breadcrumbs">${items.map((it,i)=>i<items.length-1?`<a href="#${it[1]}">${esc(it[0])}</a><span aria-hidden="true">/</span>`:`<span>${esc(it[0])}</span>`).join('')}</nav>`;
}
function mstat(m){return `<span class="mstat">${picto('major',16)}${m.major} ${T('kN')} · ${m.weight} ${T('g')}</span>`;}
function mcard(m){
  return `<a class="mcard" href="#m-${m.id}">${biner(m.vis,{label:m.brand+' '+m.name})}<span><span class="mbrand">${esc(m.brand)}</span><b>${esc(m.name)}</b>${mstat(m)}</span></a>`;
}
function specCards(){
  return `<div class="scards">${SPECS.map(s=>`<a class="scard" href="#spec-${s.id}">${picto(s.id,26)}<b>${L(s.name)}${s.unit?`<span class="unit">${U(s.unit)}</span>`:''}</b><span>${L(s.short)}</span></a>`).join('')}</div>`;
}

function tileHTML(t, models){

function renderGroups(){
  const box = document.getElementById('groups'); if(!box) return;
  const q = state.q.trim().toLowerCase(), sph = state.sphere;
  let total = 0;
  const html = GROUPS.map(g=>{
    const tiles = TYPES.filter(t=>t.group===g.id).map(t=>{
      let ms = typeModels(t);
      if(state.brand!=='all'){
        ms = ms.filter(m=>m.brand===state.brand);
        if(!ms.length) return '';
      }
      if(sph!=='all'){
        if(!t.spheres.includes(sph) && !ms.some(m=>modelSpheres(m).includes(sph))) return '';
        const hit = ms.filter(m=>modelSpheres(m).includes(sph));
        if(hit.length) ms = [...hit, ...ms.filter(m=>!hit.includes(m))];
      }
      if(q){
        const typeHit = (t.name.ru+' '+t.name.en).toLowerCase().includes(q);
        const mHit = ms.filter(m=>(m.brand+' '+m.name).toLowerCase().includes(q));
        if(!typeHit && !mHit.length) return '';
        if(mHit.length) ms = [...mHit, ...ms.filter(m=>!mHit.includes(m))];
      }
      return tileHTML(t, ms);
    }).filter(Boolean);
    total += tiles.length;
    if(!tiles.length) return '';
    return `<section class="group"><div class="ghead"><div><p class="count">${T('nTypes')(tiles.length)}</p><h2>${L(g.name)}</h2></div><p>${L(g.lead)}</p></div><div class="tiles">${tiles.join('')}</div></section>`;
  }).join('');
  box.innerHTML = total ? html : `<p class="empty">${T('empty')} <button type="button" class="btn" data-reset>${T('reset')}</button></p>`;
}
function startHeroCycle(){
  const art = document.getElementById('heroArt'), leg = document.getElementById('legend3');
  if(!art || !leg) return;
  const set = k => {art.dataset.hl = k; leg.querySelectorAll('a').forEach(a=>a.classList.toggle('on', a.dataset.hl===k));};
  set('major');
  const stop = () => {if(heroTimer){clearInterval(heroTimer);heroTimer=null;}};
  leg.querySelectorAll('a').forEach(a=>{
    a.addEventListener('mouseenter',()=>{stop();set(a.dataset.hl);});
    a.addEventListener('focus',()=>{stop();set(a.dataset.hl);});
  });
  art.addEventListener('pointerenter',stop);
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce){const order=['major','minor','open'];let i=0;heroTimer=setInterval(()=>{i=(i+1)%3;set(order[i]);},2600);}
}

/* ---------- fall calculator ---------- */
const G = 9.81, TEST_MASS = 80, TEST_FACTOR = 1.77, K_DYNEEMA = 197000, POS_FACTOR = {top:1.66, harness:1};
const fmtN = (v,d) => {const s = v.toFixed(d);return state.lang==='ru' ? s.replace('.',',') : s;};
const calcModels = () => MODELS.filter(m=>m.material==='al' && m.lock!=='quicklink').sort((a,b)=>(a.brand+a.name).localeCompare(b.brand+b.name));
// Rope stiffness k (N) from the rated impact force: UIAA test drops 80 kg at fall factor 1.77.
function ropeK(c){
  if(c.link==='sling') return K_DYNEEMA;
  const W0 = TEST_MASS*G, Fi = c.impact*1000;
  return Fi*(Fi-2*W0)/(2*W0*TEST_FACTOR);
}
const peakForce = (W,k,f) => W + Math.sqrt(W*W + 2*W*k*f);
